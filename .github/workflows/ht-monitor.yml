name: HelloTalk API Monitor

# Runs the unencrypted API probes from a GitHub Actions runner because
# the Claude Code sandbox cannot reach hellotalk8.com directly.
#
# Triggers:
#   1. Manually via the "Run workflow" button (workflow_dispatch)
#   2. Automatically when the probe script or this workflow is changed
#
# Results are committed back to monitor/ on the same branch. The path filter
# on push ensures this workflow never re-triggers itself from its own commits.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/project-status-review-upavM
    paths:
      - 'scripts/monitor-probe.sh'
      - 'scripts/monitor-probe-encrypted.py'
      - 'scripts/monitor-endpoint-sweep.py'
      - 'scripts/fetch-public-pages.sh'
      - '.github/workflows/ht-monitor.yml'

permissions:
  contents: write

concurrency:
  group: ht-monitor
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run plain API probes
        continue-on-error: true
        run: |
          chmod +x scripts/monitor-probe.sh
          bash scripts/monitor-probe.sh || echo "plain probe step failed (continuing)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps for encrypted probes
        run: pip install --quiet httpx cryptography

      - name: Run encrypted API probes
        continue-on-error: true
        run: python3 scripts/monitor-probe-encrypted.py || echo "encrypted probe step failed (continuing)"

      - name: Run endpoint discovery sweep
        continue-on-error: true
        run: python3 scripts/monitor-endpoint-sweep.py || echo "sweep step failed (continuing)"

      - name: Fetch public HelloTalk pages
        continue-on-error: true
        run: |
          chmod +x scripts/fetch-public-pages.sh
          bash scripts/fetch-public-pages.sh || echo "fetch step failed (continuing)"

      - name: Write workflow heartbeat
        if: always()
        run: |
          mkdir -p monitor/latest
          {
            echo "run_id=${{ github.run_id }}"
            echo "run_number=${{ github.run_number }}"
            echo "commit=${{ github.sha }}"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "ref=${{ github.ref_name }}"
          } > monitor/latest/_workflow_heartbeat.log
          echo "=== monitor/latest contents ==="
          ls -la monitor/latest/ 2>&1 || true
          echo "=== docs/research contents ==="
          ls -la docs/research/ 2>&1 || true
          echo "=== monitor/runs contents ==="
          ls -la monitor/runs/ 2>&1 || true

      - name: Commit results
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Defensive git add: each path is independent. Missing paths are OK.
          git add monitor/ 2>&1 || true
          git add docs/research/ 2>&1 || true
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "monitor: run ${{ github.run_number }} $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Fetch latest state in case branch moved while we were running
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          # Retry push up to 3 times with backoff
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push succeeded on attempt $attempt"
              break
            fi
            echo "Push failed attempt $attempt, retrying..."
            sleep $((attempt * 2))
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done

      - name: Print summary
        if: always()
        run: |
          if [[ -f monitor/latest/_summary.txt ]]; then
            echo "=== latest plain probe summary ==="
            cat monitor/latest/_summary.txt
          fi
          if [[ -f monitor/latest/sweep_summary.txt ]]; then
            echo "=== latest sweep summary ==="
            cat monitor/latest/sweep_summary.txt
          fi
