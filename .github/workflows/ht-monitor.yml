name: HelloTalk API Monitor

# Runs the unencrypted API probes from a GitHub Actions runner because
# the Claude Code sandbox cannot reach hellotalk8.com directly.
#
# Triggers:
#   1. Manually via the "Run workflow" button (workflow_dispatch)
#   2. Automatically when the probe script or this workflow is changed
#
# Results are committed back to monitor/ on the same branch. The path filter
# on push ensures this workflow never re-triggers itself from its own commits.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/project-status-review-upavM
    paths:
      - 'scripts/monitor-probe.sh'
      - 'scripts/monitor-probe-encrypted.py'
      - '.github/workflows/ht-monitor.yml'

permissions:
  contents: write

concurrency:
  group: ht-monitor
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run plain API probes
        run: |
          chmod +x scripts/monitor-probe.sh
          bash scripts/monitor-probe.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps for encrypted probes
        run: pip install --quiet httpx cryptography

      - name: Run encrypted API probes
        run: python3 scripts/monitor-probe-encrypted.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor/
          if git diff --cached --quiet; then
            echo "No probe changes to commit."
            exit 0
          fi
          git commit -m "monitor: probe run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Rebase on any parallel commits to avoid push conflicts
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Print summary
        if: always()
        run: |
          if [[ -f monitor/latest/_summary.txt ]]; then
            echo "=== Latest summary ==="
            cat monitor/latest/_summary.txt
          fi
